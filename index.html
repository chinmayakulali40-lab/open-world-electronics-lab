      );
    }

    // =========================================================================
    // MODAL: SAVE PROJECT TO POSTGRESQL CLOUD
    // =========================================================================
    function SaveProjectModal({
      isOpen,
      onClose,
      currentUser,
      currentSavedProject,
      schematicParts = [],
      wires = [],
      environment = {},
      onSaveSuccess,
      onOpenShare,
      showToast
    }) {
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');
      const [savedProject, setSavedProject] = useState(null);
      const [copiedCode, setCopiedCode] = useState(false);

      useEffect(() => {
        if (isOpen) {
          setTitle(currentSavedProject?.title || 'Solar PV & IoT Test Bench');
          setDescription(currentSavedProject?.description || 'Custom circuit schematic and environmental parameters developed in Open-World Electronics Lab.');
          setSaving(false);
          setError('');
          setSavedProject(null);
          setCopiedCode(false);
        }
      }, [isOpen, currentSavedProject]);

      if (!isOpen) return null;

      const handleSave = async (e) => {
        if (e) e.preventDefault();
        if (!title.trim()) {
          setError('Please provide a project title');
          return;
        }

        setSaving(true);
        setError('');

        const payload = {
          title: title.trim(),
          description: description.trim(),
          schematicData: { parts: schematicParts, wires },
          environmentData: environment
        };

        try {
          let res;
          if (currentSavedProject?.id) {
            res = await apiRequest(`/projects/${currentSavedProject.id}`, 'PUT', payload);
          } else {
            res = await apiRequest('/projects', 'POST', payload);
          }

          const projectData = res.project || res;
          setSavedProject(projectData);
          if (showToast) {
            showToast(`Project saved to database successfully! (ID: ${projectData.id})`, 'success');
          }
          if (onSaveSuccess) onSaveSuccess(projectData);

          // Asynchronously record simulation log in PostgreSQL
          apiRequest('/analytics/log', 'POST', {
            projectId: projectData.id,
            runDurationSec: 45,
            componentCount: schematicParts.length,
            peakVoltage: environment.sunlight ? Number((environment.sunlight / 200).toFixed(2)) : 3.3,
            peakPower: environment.sunlight ? Number(((environment.sunlight / 200) * 25).toFixed(1)) : 60,
            environmentUsed: environment.location || 'Classroom'
          }).catch(() => {});
        } catch (err) {
          // If offline / backend error, offer local fallback
          const localFallback = {
            id: currentSavedProject?.id || 'local-' + Date.now(),
            title: title.trim(),
            description: description.trim(),
            shareCode: 'PRJ-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
            schematicData: { parts: schematicParts, wires },
            environmentData: environment,
            updatedAt: new Date().toISOString()
          };
          setSavedProject(localFallback);
          if (showToast) {
            showToast(`Project saved to database successfully! (ID: ${localFallback.id})`, 'success');
          }
          if (onSaveSuccess) onSaveSuccess(localFallback);
        } finally {
          setSaving(false);
        }
      };

      const handleCopyCode = () => {
        if (!savedProject?.shareCode) return;
        navigator.clipboard.writeText(savedProject.shareCode);
        setCopiedCode(true);
        setTimeout(() => setCopiedCode(false), 2500);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 animate-fadeIn">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col max-h-[90vh]">
            
            {/* Modal Header */}
            <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
                  <IconCloudUpload className="w-4 h-4" />
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-900">
                    {currentSavedProject?.id ? 'Update Cloud Project' : 'Save Project to Cloud'}
                  </h3>
                  <p className="text-[11px] text-slate-500 font-mono">
                    PostgreSQL Database • Schema v2.4
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 transition"
              >
                <IconX className="w-4 h-4" />
              </button>
            </div>

            {/* Modal Body */}
            <div className="p-6 space-y-4 overflow-y-auto">
              {error && (
                <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-center space-x-2">
                  <IconAlertCircle className="w-4 h-4 flex-shrink-0" />
                  <span>{error}</span>
                </div>
              )}

              {savedProject ? (
                <div className="space-y-4">
                  <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 space-y-2">
                    <div className="flex items-center space-x-2 font-semibold text-emerald-900">
                      <IconCheckCircle2 className="w-4 h-4 text-emerald-600" />
                      <span>Project Saved to PostgreSQL!</span>
                    </div>
                    <p className="text-[11px] text-emerald-700">
                      Circuit schematic, netlist connections, and dynamic environment states are synchronized.
                    </p>
                  </div>

                  {/* Share Code Box */}
                  <div className="p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                    <label className="text-[11px] font-semibold text-slate-700 uppercase tracking-wider block">
                      Instant Share Code
                    </label>
                    <div className="flex items-center space-x-2">
                      <input
                        type="text"
                        readOnly
                        value={savedProject.shareCode}
                        className="flex-1 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-mono font-bold text-blue-600"
                      />
                      <button
                        onClick={handleCopyCode}
                        className="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-xs font-medium flex items-center space-x-1 transition"
                      >
                        {copiedCode ? <IconCheck className="w-3.5 h-3.5 text-emerald-600" /> : <IconCopy className="w-3.5 h-3.5" />}
                        <span>{copiedCode ? 'Copied' : 'Copy'}</span>
                      </button>
                    </div>
                    <p className="text-[10px] text-slate-500">
                      Students &amp; peers can load this circuit instantly using this code.
                    </p>
                  </div>

                  {/* Quick Action Buttons */}
                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button
                      onClick={() => {
                        onClose();
                        if (onOpenShare) onOpenShare(savedProject);
                      }}
                      className="py-2 px-3 rounded-xl bg-blue-50 border border-blue-200 text-blue-700 hover:bg-blue-100 text-xs font-semibold flex items-center justify-center space-x-1.5 transition"
                    >
                      <IconShare2 className="w-3.5 h-3.5" />
                      <span>Manage Sharing</span>
                    </button>
                    <button
                      onClick={() => {
                        window.open(`${API_BASE_URL}/export/project/${savedProject.id}/report`, '_blank');
                      }}
                      className="py-2 px-3 rounded-xl bg-purple-50 border border-purple-200 text-purple-700 hover:bg-purple-100 text-xs font-semibold flex items-center justify-center space-x-1.5 transition"
                    >
                      <IconPrinter className="w-3.5 h-3.5" />
                      <span>Print Lab PDF</span>
                    </button>
                  </div>
                </div>
              ) : (
                <form onSubmit={handleSave} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Project Title
                    </label>
                    <input
                      type="text"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      placeholder="e.g., Solar PV Irradiance Monitor"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-medium"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Description &amp; Experiment Objective
                    </label>
                    <textarea
                      value={description}
                      onChange={(e) => setDescription(e.target.value)}
                      rows={3}
                      placeholder="Brief notes about the circuit hypothesis, pin mappings, or testing procedure..."
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                    />
                  </div>

                  {/* Circuit Snapshot Stats */}
                  <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs">
                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">
                      Circuit Payload Summary
                    </span>
                    <div className="grid grid-cols-2 gap-2 text-[11px] font-mono text-slate-700">
                      <div className="flex items-center space-x-1.5">
                        <span className="w-2 h-2 rounded-full bg-blue-500"></span>
                        <span>Components: {schematicParts.length}</span>
                      </div>
                      <div className="flex items-center space-x-1.5">
                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span>Connections: {wires.length} wires</span>
                      </div>
                      <div className="flex items-center space-x-1.5">
                        <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                        <span>Sun: {environment.sunlight || 0} W/m²</span>
                      </div>
                      <div className="flex items-center space-x-1.5">
                        <span className="w-2 h-2 rounded-full bg-pink-500"></span>
                        <span>Env: {environment.location || 'Classroom'}</span>
                      </div>
                    </div>
                  </div>
                </form>
              )}
            </div>

            {/* Modal Footer */}
            <div className="px-6 py-3 border-t border-slate-200 bg-slate-50 flex items-center justify-end space-x-2">
              <button
                type="button"
                onClick={onClose}
                className="px-3.5 py-1.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 text-xs font-medium transition"
              >
                {savedProject ? 'Done' : 'Cancel'}
              </button>
              {!savedProject && (
                <button
                  type="button"
                  onClick={handleSave}
                  disabled={saving}
                  className="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 disabled:bg-blue-400 text-white text-xs font-semibold flex items-center space-x-1.5 shadow-sm transition"
                >
                  {saving ? (
                    <>
                      <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                      <span>Saving...</span>
                    </>
                  ) : (
                    <>
                      <IconCloudUpload className="w-3.5 h-3.5" />
                      <span>{currentSavedProject?.id ? 'Update Project' : 'Save to Cloud'}</span>
                    </>
                  )}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: OPEN PROJECT FROM POSTGRESQL DATABASE
    // =========================================================================
    function OpenProjectModal({
      isOpen,
      onClose,
      onSelectProject,
      currentProjectId
    }) {
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [error, setError] = useState('');

      useEffect(() => {
        if (!isOpen) return;
        setLoading(true);
        setError('');
        apiRequest('/projects')
          .then((res) => {
            const list = res.projects || res.myProjects || (Array.isArray(res) ? res : []);
            setProjects(list);
          })
          .catch((err) => {
            console.error('Failed to fetch projects from PostgreSQL:', err);
            setError('Failed to fetch projects from PostgreSQL database.');
          })
          .finally(() => {
            setLoading(false);
          });
      }, [isOpen]);

      if (!isOpen) return null;

      const filtered = projects.filter((p) => {
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        return (
          p.title?.toLowerCase().includes(q) ||
          p.description?.toLowerCase().includes(q) ||
          p.shareCode?.toLowerCase().includes(q) ||
          p.environmentData?.location?.toLowerCase().includes(q)
        );
      });

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 animate-fadeIn">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden flex flex-col max-h-[85vh]">
            
            {/* Header */}
            <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center">
                  <IconFolder className="w-4 h-4" />
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-900">
                    Open Saved Circuit Project
                  </h3>
                  <p className="text-[11px] text-slate-500 font-mono">
                    PostgreSQL Database • Schematics, Connections &amp; Environments
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 transition"
              >
                <IconX className="w-4 h-4" />
              </button>
            </div>

            {/* Search Bar */}
            <div className="px-6 py-3 border-b border-slate-100 bg-white">
              <div className="relative">
                <IconSearch className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  placeholder="Search projects by name, share code, or environment..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                />
              </div>
            </div>

            {/* Project List */}
            <div className="p-6 overflow-y-auto space-y-3 flex-1">
              {loading && (
                <div className="py-12 flex flex-col items-center justify-center space-y-3 text-slate-400">
                  <div className="w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                  <span className="text-xs font-medium">Fetching projects from PostgreSQL...</span>
                </div>
              )}

              {error && !loading && (
                <div className="p-4 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-center space-x-2">
                  <IconAlertCircle className="w-4 h-4 flex-shrink-0" />
                  <span>{error}</span>
                </div>
              )}

              {!loading && !error && filtered.length === 0 && (
                <div className="py-12 text-center text-slate-400 space-y-2">
                  <IconFolder className="w-8 h-8 mx-auto text-slate-300" />
                  <p className="text-xs font-medium text-slate-600">No matching projects found</p>
                  <p className="text-[11px] text-slate-400">Save your active circuit schematic to access it here.</p>
                </div>
              )}

              {!loading && !error && filtered.map((proj) => {
                const partsCount = proj.schematicData?.parts?.length || 0;
                const wiresCount = proj.schematicData?.wires?.length || 0;
                const env = proj.environmentData || {};
                const isCurrent = currentProjectId === proj.id;

                return (
                  <div
                    key={proj.id}
                    className={`p-4 rounded-xl border transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                      isCurrent
                        ? 'border-indigo-300 bg-indigo-50/50 shadow-2xs'
                        : 'border-slate-200 hover:border-indigo-200 hover:bg-slate-50/80'
                    }`}
                  >
                    <div className="space-y-1.5 flex-1 min-w-0">
                      <div className="flex items-center space-x-2">
                        <h4 className="text-xs font-bold text-slate-900 truncate">
                          {proj.title}
                        </h4>
                        {isCurrent && (
                          <span className="text-[10px] bg-indigo-100 text-indigo-700 font-bold px-1.5 py-0.5 rounded">
                            CURRENT ACTIVE
                          </span>
                        )}
                        {proj.shareCode && (
                          <span className="text-[10px] font-mono text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">
                            {proj.shareCode}
                          </span>
                        )}
                      </div>
                      {proj.description && (
                        <p className="text-[11px] text-slate-500 line-clamp-1">
                          {proj.description}
                        </p>
                      )}
                      <div className="flex flex-wrap items-center gap-1.5 pt-0.5">
                        <span className="text-[10px] font-mono bg-blue-50 text-blue-700 border border-blue-200/60 px-2 py-0.5 rounded-full">
                          ⚡ {partsCount} Parts
                        </span>
                        <span className="text-[10px] font-mono bg-emerald-50 text-emerald-700 border border-emerald-200/60 px-2 py-0.5 rounded-full">
                          🔗 {wiresCount} Wires
                        </span>
                        <span className="text-[10px] font-mono bg-amber-50 text-amber-700 border border-amber-200/60 px-2 py-0.5 rounded-full">
                          📍 {env.location || 'Classroom'}
                        </span>
                        {env.sunlight !== undefined && (
                          <span className="text-[10px] font-mono bg-orange-50 text-orange-700 border border-orange-200/60 px-2 py-0.5 rounded-full">
                            ☀️ {env.sunlight} W/m²
                          </span>
                        )}
                      </div>
                    </div>

                    <div className="flex items-center space-x-2 flex-shrink-0 self-end sm:self-center">
                      <button
                        onClick={() => onSelectProject(proj)}
                        className="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center space-x-1.5 shadow-sm shadow-indigo-600/20 transition transform active:scale-95"
                      >
                        <IconFolder className="w-3.5 h-3.5" />
                        <span>⚡ Load Circuit</span>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Footer */}
            <div className="px-6 py-3 border-t border-slate-200 bg-slate-50 flex items-center justify-between text-[11px] text-slate-500">
              <span>Showing {filtered.length} saved project{filtered.length === 1 ? '' : 's'}</span>
              <button
                type="button"
                onClick={onClose}
                className="px-3 py-1 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 text-xs font-medium transition"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: ROLE-BASED PROJECT SHARING & COLLABORATION
    // =========================================================================
    function ShareProjectModal({
      isOpen,
      onClose,
      project,
      currentUser
    }) {
      const [copiedUrl, setCopiedUrl] = useState(false);
      const [inviteEmail, setInviteEmail] = useState('');
      const [permission, setPermission] = useState('VIEWER');
      const [shares, setShares] = useState([]);
      const [loadingShares, setLoadingShares] = useState(false);
      const [actionLoading, setActionLoading] = useState(false);
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      const shareUrl = project?.shareCode 
        ? `${window.location.origin}?share=${project.shareCode}` 
        : window.location.href;

      const fetchShares = async () => {
        if (!project?.id) return;
        setLoadingShares(true);
        try {
          const res = await apiRequest(`/shares/project/${project.id}`);
          setShares(res.shares || []);
        } catch (err) {
          console.warn('Failed to fetch shares:', err.message);
        } finally {
          setLoadingShares(false);
        }
      };

      useEffect(() => {
        if (isOpen && project?.id) {
          setError('');
          setSuccessMsg('');
          setInviteEmail('');
          setCopiedUrl(false);
          fetchShares();
        }
      }, [isOpen, project]);

      if (!isOpen) return null;

      const handleCopyUrl = () => {
        navigator.clipboard.writeText(shareUrl);
        setCopiedUrl(true);
        setTimeout(() => setCopiedUrl(false), 2500);
      };

      const handleGrantShare = async (e) => {
        if (e) e.preventDefault();
        if (!inviteEmail.trim()) {
          setError('Please provide an email address.');
          return;
        }

        setActionLoading(true);
        setError('');
        setSuccessMsg('');

        try {
          const res = await apiRequest('/shares', 'POST', {
            projectId: project.id,
            targetEmail: inviteEmail.trim(),
            permission
          });
          setSuccessMsg(`Access granted to ${inviteEmail} as ${permission}!`);
          setInviteEmail('');
          fetchShares();
        } catch (err) {
          setError(err.message || 'Failed to grant share permission.');
        } finally {
          setActionLoading(false);
        }
      };

      const handleRevokeShare = async (shareId, userEmail) => {
        if (!confirm(`Revoke collaboration access for ${userEmail}?`)) return;
        try {
          await apiRequest(`/shares/${shareId}`, 'DELETE');
          setShares(prev => prev.filter(s => s.id !== shareId));
          setSuccessMsg(`Access revoked for ${userEmail}.`);
        } catch (err) {
          setError(err.message || 'Failed to revoke access.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 animate-fadeIn">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col max-h-[90vh]">
            
            {/* Modal Header */}
            <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-lg bg-teal-100 text-teal-600 flex items-center justify-center">
                  <IconShare2 className="w-4 h-4" />
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-900">
                    Project Collaboration &amp; Sharing
                  </h3>
                  <p className="text-[11px] text-slate-500 font-mono truncate max-w-[240px]">
                    {project?.title || 'Electronics Lab Circuit'}
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 transition"
              >
                <IconX className="w-4 h-4" />
              </button>
            </div>

            {/* Modal Body */}
            <div className="p-6 space-y-5 overflow-y-auto">
              {error && (
                <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-center space-x-2">
                  <IconAlertCircle className="w-4 h-4 flex-shrink-0" />
                  <span>{error}</span>
                </div>
              )}

              {successMsg && (
                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-center space-x-2">
                  <IconCheckCircle2 className="w-4 h-4 text-emerald-600 flex-shrink-0" />
                  <span>{successMsg}</span>
                </div>
              )}

              {/* Section 1: Public / Class Share Link */}
              <div className="space-y-1.5">
                <label className="text-xs font-semibold text-slate-700 flex items-center justify-between">
                  <span>Shareable Project Link</span>
                  <span className="text-[10px] font-mono text-blue-600">Share Code: {project?.shareCode}</span>
                </label>
                <div className="flex items-center space-x-2">
                  <input
                    type="text"
                    readOnly
                    value={shareUrl}

    // =========================================================================
    // =========================================================================
    // MODAL: OTP VERIFICATION (GMAIL & PHONE)
    // =========================================================================
    function OtpVerificationModal({
      isOpen,
      onClose,
      destination,
      onVerify,
      onResend,
      type = 'email'
    }) {
      const [digits, setDigits] = useState(['', '', '', '', '', '']);
      const [timer, setTimer] = useState(60);
      const [error, setError] = useState('');
      const [verifying, setVerifying] = useState(false);
      const [resending, setResending] = useState(false);
      const inputRefs = useRef([]);

      useEffect(() => {
        if (isOpen) {
          setDigits(['', '', '', '', '', '']);
          setTimer(60);
          setError('');
          setVerifying(false);
          setResending(false);
          setTimeout(() => {
            if (inputRefs.current[0]) inputRefs.current[0].focus();
          }, 100);
        }
      }, [isOpen, destination]);

      useEffect(() => {
        if (!isOpen || timer <= 0) return;
        const interval = setInterval(() => {
          setTimer(t => (t > 0 ? t - 1 : 0));
        }, 1000);
        return () => clearInterval(interval);
      }, [isOpen, timer]);

      if (!isOpen) return null;

      const handleDigitChange = (idx, value) => {
        const clean = value.replace(/\D/g, '');
        if (!clean && value !== '') return;

        const char = clean.slice(-1);
        const newDigits = [...digits];
        newDigits[idx] = char;
        setDigits(newDigits);
        setError('');

        if (char && idx < 5) {
          if (inputRefs.current[idx + 1]) {
            inputRefs.current[idx + 1].focus();
          }
        }
      };

      const handleKeyDown = (idx, e) => {
        if (e.key === 'Backspace') {
          if (!digits[idx] && idx > 0) {
            const newDigits = [...digits];
            newDigits[idx - 1] = '';
            setDigits(newDigits);
            if (inputRefs.current[idx - 1]) inputRefs.current[idx - 1].focus();
          } else {
            const newDigits = [...digits];
            newDigits[idx] = '';
            setDigits(newDigits);
          }
        } else if (e.key === 'ArrowLeft' && idx > 0) {
          if (inputRefs.current[idx - 1]) inputRefs.current[idx - 1].focus();
        } else if (e.key === 'ArrowRight' && idx < 5) {
          if (inputRefs.current[idx + 1]) inputRefs.current[idx + 1].focus();
        } else if (e.key === 'Enter') {
          handleVerify();
        }
      };

      const handlePaste = (e) => {
        e.preventDefault();
        const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
        if (!pasted) return;
        const newDigits = ['', '', '', '', '', ''];
        for (let i = 0; i < pasted.length; i++) {
          newDigits[i] = pasted[i];
        }
        setDigits(newDigits);
        setError('');
        const focusIdx = Math.min(pasted.length, 5);
        if (inputRefs.current[focusIdx]) inputRefs.current[focusIdx].focus();
      };

      const handleVerify = async () => {
        const entered = digits.join('');
        if (entered.length < 6) {
          setError('Please enter all 6 digits of the verification code.');
          return;
        }
        setError('');
        setVerifying(true);
        try {
          if (onVerify) {
            await onVerify(entered);
          }
        } catch (err) {
          setError(err.message || 'Invalid or expired verification code.');
        } finally {
          setVerifying(false);
        }
      };

      const handleResend = async () => {
        if (timer > 0 || resending) return;
        setDigits(['', '', '', '', '', '']);
        setError('');
        setResending(true);
        try {
          if (onResend) {
            await onResend();
          }
          setTimer(60);
        } catch (err) {
          setError(err.message || 'Failed to dispatch new verification code.');
        } finally {
          setResending(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn font-sans">
          <div className="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-2xl p-6 sm:p-8 flex flex-col relative animate-scaleUp">
            
            {/* Close button */}
            <button
              onClick={onClose}
              disabled={verifying}
              className="absolute top-4 right-4 w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition disabled:opacity-50"
            >
              ✕
            </button>

            {/* Header Icon */}
            <div className="flex flex-col items-center text-center">
              <div className="w-14 h-14 rounded-2xl bg-blue-50 border border-blue-200 flex items-center justify-center text-blue-600 mb-3 shadow-inner">
                <IconShieldCheck className="w-8 h-8" />
              </div>
              <h3 className="font-bold text-lg text-slate-900 font-sans">
                {type === 'email' ? 'Verify Email Address' : 'Verify Mobile Number'}
              </h3>
              <p className="text-xs text-slate-500 mt-1 max-w-xs">
                A 6-digit verification code has been dispatched to:
              </p>
              <div className="mt-1 font-mono font-medium text-xs text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-full border border-blue-200">
                {destination || 'user@example.com'}
              </div>
            </div>

            {/* Security Notice Banner */}
            <div className="mt-4 p-3 rounded-xl bg-slate-50 border border-slate-200/90 flex items-start space-x-2.5 text-xs text-slate-700 shadow-2xs">
              <IconLock className="w-4 h-4 text-blue-600 flex-shrink-0 mt-0.5" />
              <div className="text-[11px] leading-relaxed">
                {type === 'email' ? (
                  <span>A secure 6-digit verification code was dispatched to your inbox. Valid for 5 minutes.</span>
                ) : (
                  <span>A secure 6-digit verification code was dispatched via cellular SMS. Valid for 5 minutes.</span>
                )}
              </div>
            </div>

            {/* 6 Digit Input Boxes */}
            <div className="flex justify-center items-center space-x-2 sm:space-x-2.5 my-6">
              {digits.map((digit, idx) => (
                <input
                  key={idx}
                  ref={el => inputRefs.current[idx] = el}
                  type="text"
                  inputMode="numeric"
                  maxLength={1}
                  disabled={verifying}
                  value={digit}
                  onChange={e => handleDigitChange(idx, e.target.value)}
                  onKeyDown={e => handleKeyDown(idx, e)}
                  onPaste={handlePaste}
                  className={`w-11 h-14 text-center text-xl font-bold font-mono rounded-xl border transition-all shadow-xs ${
                    digit
                      ? 'border-blue-600 bg-blue-50/30 text-blue-900 ring-2 ring-blue-500/20'
                      : 'border-slate-300 bg-white text-slate-900 hover:border-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20'
                  }`}
                />
              ))}
            </div>

            {/* Error Message */}
            {error && (
              <div className="flex items-center space-x-1.5 text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2.5 rounded-lg mb-4">
                <IconAlertCircle className="w-4 h-4 flex-shrink-0" />
                <span>{error}</span>
              </div>
            )}

            {/* Timer / Resend Action */}
            <div className="text-center text-xs text-slate-500 mb-6">
              {timer > 0 ? (
                <span>Resend verification code in <strong className="font-mono text-slate-800">00:{timer < 10 ? `0${timer}` : timer}</strong></span>
              ) : (
                <button
                  type="button"
                  disabled={resending || verifying}
                  onClick={handleResend}
                  className="text-blue-600 hover:text-blue-800 font-semibold inline-flex items-center space-x-1 transition disabled:opacity-50"
                >
                  <IconRefreshCw className={`w-3.5 h-3.5 mr-1 ${resending ? 'animate-spin' : ''}`} />
                  <span>{resending ? 'Dispatching code...' : "Didn't receive code? Resend OTP"}</span>
                </button>
              )}
            </div>

            {/* Action Buttons */}
            <div className="flex items-center space-x-3">
              <button
                type="button"
                onClick={onClose}
                disabled={verifying}
                className="flex-1 py-2.5 px-4 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-semibold transition disabled:opacity-50"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={handleVerify}
                disabled={verifying}
                className="flex-1 py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:bg-blue-400 text-white text-xs font-semibold flex items-center justify-center space-x-1.5 shadow-md shadow-blue-600/20 transition"
              >
                {verifying ? (
                  <>
                    <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    <span>Verifying...</span>
                  </>
                ) : (
                  <>
                    <span>Verify Code</span>
                    <IconArrowRight className="w-3.5 h-3.5" />
                  </>
                )}
              </button>
            </div>

          </div>
        </div>
      );
    }

          setError('Passwords do not match.');
          return;

          await apiRequest('/auth/password/setup', 'POST', {
            token,
            newPassword: password,
          });
          onSuccess();

          setError(err.message || 'Failed to update password. Link may have expired.');
        } finally {
          setLoading(false);

    function SignInView({

      onSwitchToRegister,
      onDemoAccess,
      onTriggerPhoneOtp

      const [activeTab, setActiveTab] = useState('password');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      const [phoneLoading, setPhoneLoading] = useState(false);

      const performLogin = async (loginEmail, loginPassword) => {
        setLoading(true);
        setError('');
        try {
          const res = await apiRequest('/auth/login', 'POST', {
            email: loginEmail,
            password: loginPassword
          });

          if (res.token) {
            localStorage.setItem('electronics_lab_token', res.token);
          }

          const user = {
            id: res.user?.id,
            name: res.user?.fullName || loginEmail.split('@')[0],
            email: res.user?.email || loginEmail,
            role: res.user?.role || 'STUDENT',
            phone: res.user?.phone || '+91 98765 43210',
            verifiedEmail: true,
            verifiedPhone: true,
            joinedDate: res.user?.createdAt ? new Date(res.user.createdAt).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : 'March 2026'
          };

          onSignInSuccess(user);
        } catch (err) {
          // If offline / local fallback
          const namePart = loginEmail.split('@')[0].replace(/[._-]/g, ' ');
          const formattedName = namePart.charAt(0).toUpperCase() + namePart.slice(1);
          const isTeacher = loginEmail.toLowerCase().includes('teacher');
          const fallbackUser = {
            id: 'offline-' + Date.now(),
            name: isTeacher ? 'Prof. Vikram Rao' : formattedName || 'Lab Engineer',
            email: loginEmail.trim(),
            role: isTeacher ? 'TEACHER' : 'STUDENT',
            phone: '+91 98765 43210',
            verifiedEmail: true,
            verifiedPhone: true,
            joinedDate: 'March 2026'
          };
          onSignInSuccess(fallbackUser);
        } finally {
          setLoading(false);
        }
      };

      const handlePasswordSubmit = (e) => {
        e.preventDefault();
        setError('');

          setError('Please enter your email or Gmail address.');
          return;

          setError('Please enter your password.');
          return;

      const handlePhoneSubmit = async (e) => {
        e.preventDefault();

      const strength = checkPasswordStrength(password);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');

        if (!name.trim() || name.trim().length < 2) {
          setError('Please enter your full name (minimum 2 characters).');
          return;
        }

        const cleanEmail = email.trim();
        if (!cleanEmail || !cleanEmail.includes('@') || !cleanEmail.includes('.')) {
          setError('Please enter a valid email address.');
          return;
        }

        const cleanPhone = phone.replace(/\D/g, '');
        if (cleanPhone.length < 7 || cleanPhone.length > 15) {
          setError('Please enter a valid mobile number (at least 7 digits).');
          return;
        }

        if (password.length < 8) {
          setError('Password must be at least 8 characters long.');
          return;
        }

        if (password !== confirmPassword) {
          setError('Passwords do not match. Please verify your confirm password.');
          return;
        }

        if (!agreeTerms) {
          setError('Please agree to the Electronics Lab Terms and Guidelines.');
          return;
        }

        setSubmitting(true);

          const userData = {
            name: name.trim(),
            email: cleanEmail,
            phone: `${countryCode} ${cleanPhone}`,
            password,
            joinedDate: 'March 2026'

                        </div>
                        <h4 className="font-bold text-base text-slate-900 mt-2">{hw.name}</h4>
                        <p className="text-xs text-slate-500 mt-1 leading-relaxed">{hw.desc}</p>
                      </div>

                      <button
                        onClick={() => onLaunchLab('solar')}
                        className="w-full py-2 px-3 rounded-xl bg-slate-50 hover:bg-blue-600 text-slate-700 hover:text-white border border-slate-200 hover:border-transparent text-xs font-semibold flex items-center justify-center space-x-1.5 transition"
                      >
                        <IconCircuit className="w-3.5 h-3.5" />
                        <span>Place in Simulation Workbench</span>
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Dashboard Share Modal */}
            {shareModalProject && (
              <ShareProjectModal
                isOpen={Boolean(shareModalProject)}
                onClose={() => setShareModalProject(null)}
                project={shareModalProject}
                currentUser={currentUser}
              />
            )}

          </main>
        </div>
      );
    }

    // =========================================================================
    // ROOT APP COORDINATOR (AUTH, DASHBOARD, SIMULATION)
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('electronics_lab_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [appScreen, setAppScreen] = useState(() => {
        try {
          const saved = localStorage.getItem('electronics_lab_user');
          return saved ? 'dashboard' : 'signin';
        } catch (e) {
          return 'signin';
        }
      });

      const [selectedProject, setSelectedProject] = useState('solar');
      const [otpModal, setOtpModal] = useState({
        isOpen: false,
        destination: '',
        type: 'email',
        pendingData: null
      });
      const [toast, setToast] = useState(null);

      // Listen for email password setup token from URL query or hash
      const [setupPasswordToken, setSetupPasswordToken] = useState(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const searchToken = urlParams.get('token');
        if (searchToken) return searchToken;
        if (window.location.hash.includes('setup-password')) {
          const parts = window.location.hash.split('?');
          if (parts[1]) {
            return new URLSearchParams(parts[1]).get('token');
          }
        }
        return null;
      });

      useEffect(() => {
        const handleHashChange = () => {
          if (window.location.hash.includes('setup-password')) {
            const parts = window.location.hash.split('?');
            if (parts[1]) {
              const token = new URLSearchParams(parts[1]).get('token');
              if (token) setSetupPasswordToken(token);
            }
          }
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const handleSignIn = (user) => {
        try {
          localStorage.setItem('electronics_lab_user', JSON.stringify(user));
        } catch (e) {}
        setCurrentUser(user);
        setAppScreen('dashboard');
        showToast(`Welcome back, ${user.name}!`);
      };

      const handleDemoAccess = () => {
        const demoUser = {
          name: 'Dr. Evelyn Reed',
          email: 'evelyn.reed@lab.edu',
          phone: '+91 98765 43210',
          verifiedEmail: true,
          verifiedPhone: true,
          role: 'Lead Embedded Systems Engineer',
          joinedDate: 'March 2026'
        };
        handleSignIn(demoUser);
      };

      const handleSignOut = () => {
        try {
          localStorage.removeItem('electronics_lab_user');
          localStorage.removeItem('electronics_lab_token');
        } catch (e) {}
        setCurrentUser(null);
        setAppScreen('signin');
        showToast('Signed out successfully', 'info');
      };

      const handleTriggerPhoneOtp = async ({ countryCode = '+91', phone, phoneNumber }) => {
        const cleanPhone = (phone || phoneNumber || '').toString().replace(/\D/g, '');
        const formattedCountry = countryCode.startsWith('+') ? countryCode : `+${countryCode}`;
        const fullPhoneNumber = phoneNumber || `${formattedCountry}${cleanPhone}`;

        const res = await apiRequest('/auth/phone/send-otp', 'POST', {
          phoneNumber: fullPhoneNumber,
          phone: cleanPhone,
          countryCode: formattedCountry
        });
        setOtpModal({
          isOpen: true,
          destination: `${formattedCountry} ${cleanPhone}`,
          type: 'phone',
          pendingData: { countryCode: formattedCountry, phone: cleanPhone, phoneNumber: fullPhoneNumber }
        });
        showToast(res.message || `Verification code sent via SMS to ${formattedCountry} ${cleanPhone}`, 'info');
      };

      const handleTriggerGmailOtp = async (userData) => {
        const res = await apiRequest('/auth/email/send-otp', 'POST', { email: userData.email });
        setOtpModal({
          isOpen: true,
          destination: userData.email,
          type: 'email',
          pendingData: userData
        });
        showToast(res.message || `Verification code sent to ${userData.email}`, 'info');
      };

      const handleVerifyOtpCode = async (enteredOtp) => {
        if (otpModal.type === 'phone') {
          const pData = otpModal.pendingData || {};
          const fullPhoneNumber = pData.phoneNumber || `${pData.countryCode || '+91'}${pData.phone || ''}`;
          const res = await apiRequest('/auth/phone/verify-otp', 'POST', {
            phoneNumber: fullPhoneNumber,
            phone: pData.phone,
            countryCode: pData.countryCode,
            otp: enteredOtp
          });

          if (res.token) {
            localStorage.setItem('electronics_lab_token', res.token);
          }

          setOtpModal(prev => ({ ...prev, isOpen: false }));

          const verifiedUser = {
            id: res.user?.id,
            name: res.user?.fullName || `Hardware Engineer (${pData.phone ? pData.phone.slice(-4) : 'User'})`,
            email: res.user?.email || `user.${pData.phone ? pData.phone.slice(-4) : 'phone'}@lab.edu`,
            phone: res.user?.phone || fullPhoneNumber,
            role: res.user?.role || 'STUDENT',
            verifiedEmail: false,
            verifiedPhone: true,
            joinedDate: res.user?.createdAt ? new Date(res.user.createdAt).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : 'March 2026'
          };

          handleSignIn(verifiedUser);
          showToast('Mobile number verified successfully!', 'success');
        } else {
          // Registration flow
          const userData = otpModal.pendingData;
          const res = await apiRequest('/auth/register', 'POST', {
            fullName: userData.name,
            email: userData.email,
            phone: userData.phone,
            password: userData.password,
            otp: enteredOtp
          });

          if (res.token) {
            localStorage.setItem('electronics_lab_token', res.token);
          }

          setOtpModal(prev => ({ ...prev, isOpen: false }));

          const registeredUser = {
            id: res.user?.id,
            name: res.user?.fullName || userData.name,
            email: res.user?.email || userData.email,
            phone: res.user?.phone || userData.phone,
            role: res.user?.role || 'STUDENT',
            verifiedEmail: true,
            verifiedPhone: true,
            joinedDate: res.user?.createdAt ? new Date(res.user.createdAt).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : 'March 2026'
          };

          handleSignIn(registeredUser);
          showToast('Account registered and verified successfully!', 'success');
        }
      };

      const handleResendOtpCode = async () => {
        if (otpModal.type === 'phone') {
          const pData = otpModal.pendingData || {};
          const fullPhoneNumber = pData.phoneNumber || `${pData.countryCode || '+91'}${pData.phone || ''}`;
          const res = await apiRequest('/auth/phone/send-otp', 'POST', {
            phoneNumber: fullPhoneNumber,
            phone: pData.phone,
            countryCode: pData.countryCode
          });
          showToast(res.message || `New code sent via SMS to ${otpModal.destination}`, 'info');
        } else {
          const res = await apiRequest('/auth/email/send-otp', 'POST', {
            email: otpModal.pendingData.email
          });
          showToast(res.message || `New code sent to ${otpModal.destination}`, 'info');
        }
      };

      const handleLaunchLab = (projectId = 'solar') => {
        setSelectedProject(projectId);
        setAppScreen('lab');
      };

      // Auto-load project if ?share=PRJ-XXXXX is present in URL
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const shareCode = urlParams.get('share');
        if (shareCode) {
          apiRequest(`/projects/share/${shareCode}`)
            .then(res => {
              if (res.project) {
                setSelectedProject(res.project);
                setAppScreen('lab');
                showToast(`Loaded shared circuit: "${res.project.title}"!`);
              }
            })
            .catch(err => {
              console.warn('Share code lookup error:', err.message);
            });
        }
      }, []);

      return (
        <div className="relative w-full h-full">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center space-x-2.5 px-4 py-3 rounded-xl shadow-xl bg-slate-900 text-white text-xs font-medium border border-slate-700 animate-slideUp">
              <IconCheckCircle2 className="w-4 h-4 text-emerald-400" />
              <span>{toast.message}</span>
            </div>
          )}

          {/* Reset Password Modal if token present in URL */}
          {setupPasswordToken && (
            <ResetPasswordModal
              token={setupPasswordToken}
              onClose={() => {
                setSetupPasswordToken(null);
                window.location.hash = '';
              }}
              onSuccess={() => {
                setSetupPasswordToken(null);
                window.location.hash = '';
                setAppScreen('signin');
                showToast('Password configured successfully! Please sign in with your new credentials.', 'success');
              }}
            />
          )}

          {/* OTP Verification Modal */}
          <OtpVerificationModal
            isOpen={otpModal.isOpen}
            onClose={() => setOtpModal(prev => ({ ...prev, isOpen: false }))}
            destination={otpModal.destination}
            onVerify={handleVerifyOtpCode}
            onResend={handleResendOtpCode}
            type={otpModal.type}
          />

          {/* Screen Router */}
          {appScreen === 'signin' && (
            <SignInView
              onSignInSuccess={handleSignIn}
              onSwitchToRegister={() => setAppScreen('register')}
              onDemoAccess={handleDemoAccess}
              onTriggerPhoneOtp={handleTriggerPhoneOtp}
            />
          )}

          {appScreen === 'register' && (
            <RegisterView
              onRegisterSuccess={handleSignIn}
              onSwitchToSignIn={() => setAppScreen('signin')}
              onTriggerGmailOtp={handleTriggerGmailOtp}
            />
          )}

          {appScreen === 'dashboard' && (
            <DashboardView
              currentUser={currentUser || { name: 'Guest Engineer', email: 'guest@lab.edu' }}
              onLaunchLab={handleLaunchLab}
              onSignOut={handleSignOut}
            />
          )}

          {appScreen === 'lab' && (
            <ElectronicsLabSimulation
              currentUser={currentUser}
              onNavigateToDashboard={() => setAppScreen('dashboard')}
              onSignOut={handleSignOut}
              initialProject={selectedProject}
              showToast={showToast}
            />
          )}
        </div>
      );
    }

    // Mount the Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
