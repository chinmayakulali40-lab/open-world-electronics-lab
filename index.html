  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Glow Utilities */
    .glow-cyan {
      filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.45));
    }
    .glow-green {
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.35), inset 0 0 8px rgba(16, 185, 129, 0.15);
    }
    .glow-amber {
      filter: drop-shadow(0 0 8px rgba(217, 119, 6, 0.45));
    }

    /* 2D Schematic Dot-Grid */
    .schematic-dot-grid {
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 20px 20px;
    }

    /* Range slider custom styling */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 9999px;
      background: #e2e8f0;
    }
    input[type=range]::-moz-range-track {
      height: 6px;
      border-radius: 9999px;
      background: #e2e8f0;
    }

    /* Slider thumb variations with dynamic glow */
    .thumb-amber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f59e0b;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.85);
      transition: transform 0.15s ease;
    }
    .thumb-amber::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .thumb-pink::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ec4899;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.85);
      transition: transform 0.15s ease;
    }
    .thumb-pink::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .thumb-cyan::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.85);
      transition: transform 0.15s ease;
    }
    .thumb-cyan::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .thumb-purple::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #a855f7;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.85);
      transition: transform 0.15s ease;
    }
    .thumb-purple::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* Oscilloscope scanline texture */
    .scanlines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.3) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 6px 100%;
    }

    /* Snapshot flash animation */
    @keyframes cameraFlash {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-active {
      animation: cameraFlash 0.45s ease-out forwards;
    }

</head>

    const apiRequest = async (endpoint, method = 'GET', data = null, tokenOverride = null) => {
      const token = tokenOverride || localStorage.getItem('electronics_lab_token');
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const config = { method, headers };
      if (data && (method === 'POST' || method === 'PUT')) {
        config.body = JSON.stringify(data);
      }

      try {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, config);
        const json = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(json.error || `HTTP ${response.status}`);
        }
        return json;
      } catch (err) {
        console.warn(`API request to ${endpoint} failed:`, err.message);
        throw err;
      }
    };

      let score = 0;
      if (!pwd) return { score: 0, label: 'Empty', color: 'bg-slate-200', width: '0%', textClass: 'text-slate-400' };
      if (pwd.length >= 8) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
      if (/[!@#$%^&*(),.?":{}|<>]/.test(pwd)) score++;

      if (score <= 1) return { score: 1, label: 'Weak', color: 'bg-rose-500', width: '25%', textClass: 'text-rose-600' };
      if (score === 2) return { score: 2, label: 'Fair', color: 'bg-amber-500', width: '50%', textClass: 'text-amber-600' };
      if (score === 3) return { score: 3, label: 'Good', color: 'bg-blue-500', width: '75%', textClass: 'text-blue-600' };

    // =========================================================================
    // PROCEDURAL AMBIENT RAIN AUDIO SYNTHESIZER (Native Web Audio API)
    // =========================================================================
    class ProceduralRainAudio {
      constructor() {
        this.ctx = null;
        this.noiseNode = null;
        this.filterNode = null;
        this.gainNode = null;
        this.isPlaying = false;
      }
      start() {
        if (this.isPlaying) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!this.ctx) {
            this.ctx = new AudioContextClass();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }

          // Generate 2 seconds of pink/white noise buffer for warm rain acoustic patter
          const bufferSize = this.ctx.sampleRate * 2;
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.045;
            b6 = white * 0.115926;
          }

          this.noiseNode = this.ctx.createBufferSource();
          this.noiseNode.buffer = noiseBuffer;
          this.noiseNode.loop = true;

          // Gentle lowpass filter shaping raindrops on glass/canopy
          this.filterNode = this.ctx.createBiquadFilter();
          this.filterNode.type = 'lowpass';
          this.filterNode.frequency.setValueAtTime(1400, this.ctx.currentTime);

          this.gainNode = this.ctx.createGain();
          this.gainNode.gain.setValueAtTime(0.001, this.ctx.currentTime);
          this.gainNode.gain.exponentialRampToValueAtTime(0.12, this.ctx.currentTime + 0.6);

          this.noiseNode.connect(this.filterNode);
          this.filterNode.connect(this.gainNode);
          this.gainNode.connect(this.ctx.destination);

          this.noiseNode.start();
          this.isPlaying = true;
        } catch (err) {
          console.warn('Procedural rain audio setup warning:', err);
        }
      }
      stop() {
        if (!this.isPlaying) return;
        try {
          if (this.gainNode && this.ctx && this.ctx.state === 'running') {
            this.gainNode.gain.setValueAtTime(this.gainNode.gain.value, this.ctx.currentTime);
            this.gainNode.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.35);
            setTimeout(() => {
              if (this.noiseNode) {
                try {
                  this.noiseNode.stop();
                  this.noiseNode.disconnect();
                } catch (e) {}
              }
              this.isPlaying = false;
            }, 400);
          } else {
            this.isPlaying = false;
          }
        } catch (err) {
          this.isPlaying = false;
        }
      }
    }

    // =========================================================================
    // ELECTRONICS LAB SIMULATION COMPONENT
    // =========================================================================
    function ElectronicsLabSimulation({
      currentUser,
      onNavigateToDashboard,

      initialProject,
      onProjectLoaded,
      showToast
    }) {
      // 1. Navigation & Views
      const [activeView, setActiveView] = useState('2D Circuit Layer'); // '2D Circuit Layer' | '3D World (FPP)'

      const [clouds, setClouds] = useState(0);             // % (0 - 100)
      const [timeMinutes, setTimeMinutes] = useState(750); // 12:30 PM (750 mins)

      // 3. Shared Circuit State

      const [servoAngle, setServoAngle] = useState(115);

      // 5. Effects & Camera
      const [cameraResetTrigger, setCameraResetTrigger] = useState(0);
      const [flashEffect, setFlashEffect] = useState(false);
      const [firmwareModalOpen, setFirmwareModalOpen] = useState(false);
      const [serialLogs, setSerialLogs] = useState([]);

      // Cloud Persistence & Role Sharing State
      const [saveModalOpen, setSaveModalOpen] = useState(false);
      const [shareModalOpen, setShareModalOpen] = useState(false);
      const [openProjectModalOpen, setOpenProjectModalOpen] = useState(false);
      const [currentSavedProject, setCurrentSavedProject] = useState(null);

      // Handler to load a project selected from OpenProjectModal
      const handleLoadProject = (proj) => {
        if (!proj) return;
        if (proj.schematicData) {
          if (proj.schematicData.parts) setSchematicParts(proj.schematicData.parts);
          if (proj.schematicData.wires) setWires(proj.schematicData.wires);
        }
        if (proj.environmentData) {
          const env = proj.environmentData;
          if (env.sunlight !== undefined) setSunlight(env.sunlight);
          if (env.temperature !== undefined) setTemperature(env.temperature);
          if (env.clouds !== undefined) setClouds(env.clouds);
          if (env.timeMinutes !== undefined) setTimeMinutes(env.timeMinutes);
          if (env.location) setCurrentLocation(env.location);
          if (env.weather) setActiveWeather(env.weather);
        }
        setSelectedPartId(null);
        setSelectedWireId(null);
        setCurrentSavedProject(proj);
        if (showToast) {
          showToast(`Circuit "${proj.title}" loaded successfully!`, 'success');
        }
        setOpenProjectModalOpen(false);
      };

      // Save circuit schematic and environment directly to PostgreSQL
      const handleSaveProject = async () => {
        let projectTitle = currentSavedProject?.title;

        // If unsaved or missing title, prompt user
        if (!projectTitle) {
          projectTitle = window.prompt('Enter project title for PostgreSQL database:', 'Solar PV & IoT Test Bench');
          if (!projectTitle || !projectTitle.trim()) {
            return; // User cancelled
          }
          projectTitle = projectTitle.trim();
        }

        const payload = {
          title: projectTitle,
          description: currentSavedProject?.description || 'Custom circuit schematic and environmental parameters developed in Open-World Electronics Lab.',
          schematicData: { parts: schematicParts, wires },
          environmentData: {
            sunlight,
            temperature,
            clouds,
            timeMinutes,
            weather: activeWeather,
            location: currentLocation
          }
        };

        try {
          let res;
          if (currentSavedProject?.id && !String(currentSavedProject.id).startsWith('local-')) {
            res = await apiRequest(`/projects/${currentSavedProject.id}`, 'PUT', payload);
          } else {
            res = await apiRequest('/projects', 'POST', payload);
          }

          const saved = res.project || res;
          setCurrentSavedProject(saved);
          if (showToast) {
            showToast(`Project saved to database successfully! (ID: ${saved.id})`, 'success');
          }

          // Asynchronously log simulation telemetry in PostgreSQL
          apiRequest('/analytics/log', 'POST', {
            projectId: saved.id,
            runDurationSec: 45,
            componentCount: schematicParts.length,
            peakVoltage: Number(voltage.toFixed(2)),
            peakPower: Number(((voltage / 5) * 60).toFixed(1)),
            environmentUsed: currentLocation || 'Classroom'
          }).catch(() => {});
        } catch (err) {
          console.error('Save failed, falling back to modal:', err);
          setSaveModalOpen(true);
        }
      };

      // Dynamic rain weather tracking
      const preRainWeatherRef = useRef('Sunny');
      const preRainSunlightRef = useRef(500);

      // Load initial circuit project preset if specified from Dashboard or PostgreSQL
      useEffect(() => {
        if (initialProject) {
          if (typeof initialProject === 'object' && initialProject.schematicData) {
            // Dynamic project loaded from PostgreSQL
            if (initialProject.schematicData.parts) setSchematicParts(initialProject.schematicData.parts);
            if (initialProject.schematicData.wires) setWires(initialProject.schematicData.wires);
            if (initialProject.environmentData) {
              const env = initialProject.environmentData;
              if (env.sunlight !== undefined) setSunlight(env.sunlight);
              if (env.temperature !== undefined) setTemperature(env.temperature);
              if (env.clouds !== undefined) setClouds(env.clouds);
              if (env.timeMinutes !== undefined) setTimeMinutes(env.timeMinutes);
              if (env.location) setCurrentLocation(env.location);
              if (env.weather) setActiveWeather(env.weather);
            }
            setCurrentSavedProject(initialProject);
            if (showToast && initialProject.title) {
              showToast(`Circuit "${initialProject.title}" loaded successfully!`, 'success');
            }
          } else if (typeof initialProject === 'string' && !['solar', 'esp32', 'arduino', 'new'].includes(initialProject)) {
            apiRequest(`/projects/${initialProject}`).then(res => {
              if (res.project) handleLoadProject(res.project);
            }).catch(e => console.warn('Failed to load project ID:', e));
          } else if (initialProject === 'solar') {
            setSchematicParts(SOLAR_SAMPLE_PARTS);
            setWires(SOLAR_SAMPLE_WIRES);
            setSunlight(850);
            setActiveWeather('Sunny');
            setCurrentSavedProject(null);
          } else if (initialProject === 'esp32') {
            setSchematicParts(ESP32_SAMPLE_PARTS);
            setWires(ESP32_SAMPLE_WIRES);
            setSunlight(550);
            setCurrentSavedProject(null);
          } else if (initialProject === 'arduino') {
            setSchematicParts(INITIAL_SCHEMATIC_PARTS);
            setWires(INITIAL_WIRES);
            setSunlight(400);
            setCurrentSavedProject(null);
          } else if (initialProject === 'new') {
            setSchematicParts([]);
            setWires([]);
            setCurrentSavedProject(null);
          }
          if (onProjectLoaded) onProjectLoaded();
        }
      }, [initialProject]);

      // Print / PDF Lab Report Generation
      const handlePrintReport = async () => {
        if (currentSavedProject?.id && !String(currentSavedProject.id).startsWith('local-')) {
          window.open(`${API_BASE_URL}/export/project/${currentSavedProject.id}/report`, '_blank');
          return;
        }

        // Direct export of active workbench schematic & environment
        try {
          const res = await fetch(`${API_BASE_URL}/export/direct-report`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: currentSavedProject?.title || 'Workbench Circuit Analysis',
              description: currentSavedProject?.description || 'Circuit schematic & instrumentation telemetry from Open-World Electronics Lab.',
              schematicData: { parts: schematicParts, wires },
              environmentData: { sunlight, temperature, clouds, timeMinutes, weather: activeWeather, location: currentLocation },
              authorName: currentUser?.name || 'Lab Student'
            })
          });
          const html = await res.text();
          const win = window.open('', '_blank');
          if (win) {
            win.document.open();
            win.document.write(html);
            win.document.close();
          } else {
            alert('Popup blocker prevented opening the lab report. Please allow popups for this site.');
          }
        } catch (err) {
          console.error('Failed to generate report:', err);
          alert('Could not connect to report service. Ensure backend is running.');
        }
      };

      // Download Netlist JSON Export
      const handleExportJson = () => {
        const netlistData = {
          meta: {
            title: currentSavedProject?.title || 'Open-World Circuit Netlist',
            author: currentUser?.name || 'Lab Student',
            exportedAt: new Date().toISOString(),
            version: 'Proteus-v2.4-compatible'
          },
          schematic: {
            parts: schematicParts,
            wires: wires
          },
          environment: {
            sunlight,
            temperature,
            clouds,
            timeMinutes,
            weather: activeWeather,
            location: currentLocation
          },
          measurements: {
            voltage,
            currentVal,
            espAdc,
            potValue
          }
        };

        const blob = new Blob([JSON.stringify(netlistData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `schematic-${currentSavedProject?.shareCode || 'export'}-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleCloudsChange = (newClouds) => {
        setClouds(newClouds);
        if (newClouds > 80) {
          if (activeWeather !== 'Rainy') {
            preRainWeatherRef.current = activeWeather;
            preRainSunlightRef.current = sunlight;
            setActiveWeather('Rainy');
          }
          // Dynamically lower sunlight level (heavy storm clouds block direct sun)
          const factor = Math.max(0.08, 1 - ((newClouds - 80) / 20) * 0.82);
          const loweredSun = Math.max(20, Math.round(preRainSunlightRef.current * factor));
          setSunlight(loweredSun);
        } else {
          if (activeWeather === 'Rainy') {
            setActiveWeather(preRainWeatherRef.current || 'Sunny');
            setSunlight(preRainSunlightRef.current || 500);
          }
        }
      };

      // Preset Location Handler (Dynamic Themes & Environment Parameters)
      const handleLocationSelect = (locId) => {
        setCurrentLocation(locId);
        const loc = LOCATIONS.find(l => l.id === locId);
        if (loc) {
          if (loc.sunlight !== undefined) setSunlight(loc.sunlight);
          if (loc.temp !== undefined) setTemperature(loc.temp);
          if (loc.clouds !== undefined) handleCloudsChange(loc.clouds);
          preRainSunlightRef.current = loc.sunlight;
          preRainWeatherRef.current = loc.clouds > 80 ? 'Rainy' : (loc.sunlight >= 700 ? 'Sunny' : 'Cloudy');
        }
      };

      // =========================================================================
      // 3. BASIC CIRCUIT SIMULATION LOGIC ENGINE (Runtime Loop)
      // =========================================================================
      useEffect(() => {
        if (!isRunning) return;

        const interval = setInterval(() => {
          // 1. Calculate Solar PV output: scales dynamically from 0.00 V (at 0 W/m² / Night) up to 5.00 V (at 1000 W/m² / Full Sun)
          const effectiveLight = Math.max(0, sunlight * (1 - clouds * 0.0085));
          const solarVoc = Math.min(5.00, Math.max(0.00, (effectiveLight / 1000.0) * 5.0));

          // 2. Calculate LDR light-dependent resistance
          const rLdr = Math.max(200, 100000 / (1 + effectiveLight * 0.08)); // 200Ω in full sun to 100kΩ in dark
          const rFixed = 10000; // 10k fixed divider resistor
          const ldrV = 5.0 * (rFixed / (rLdr + rFixed));

          // 3. Circuit connectivity & component presence checks
          const hasSolar = schematicParts.some(p => p.type === 'solar');
          const hasLdr = schematicParts.some(p => p.type === 'ldr');
          const hasEsp32 = schematicParts.some(p => p.type === 'esp32');

          // Check if DMM, Scope, Arduino, or ESP32 are connected to Solar Panel
          const isDmmWiredToSolar = wires.some(w => {
            const fromP = schematicParts.find(p => p.id === w.fromPart);
            const toP = schematicParts.find(p => p.id === w.toPart);
            return (fromP?.type === 'solar' && toP?.type === 'dmm') || (fromP?.type === 'dmm' && toP?.type === 'solar');
          });
          const isScopeWiredToSolar = wires.some(w => {
            const fromP = schematicParts.find(p => p.id === w.fromPart);
            const toP = schematicParts.find(p => p.id === w.toPart);
            return (fromP?.type === 'solar' && toP?.type === 'scope') || (fromP?.type === 'scope' && toP?.type === 'solar');
          });
          const isArduinoWiredToSolar = wires.some(w => {
            const fromP = schematicParts.find(p => p.id === w.fromPart);
            const toP = schematicParts.find(p => p.id === w.toPart);
            return (fromP?.type === 'solar' && toP?.type === 'arduino_uno') || (fromP?.type === 'arduino_uno' && toP?.type === 'solar');
          });

          // Check if Solar Panel or LDR is wired to ESP32
          const isSolarWiredToEsp32 = wires.some(w => {
            const fromP = schematicParts.find(p => p.id === w.fromPart);
            const toP = schematicParts.find(p => p.id === w.toPart);
            return (fromP?.type === 'solar' && toP?.type === 'esp32') || (fromP?.type === 'esp32' && toP?.type === 'solar');
          });
          const isLdrWiredToEsp32 = wires.some(w => {
            const fromP = schematicParts.find(p => p.id === w.fromPart);
            const toP = schematicParts.find(p => p.id === w.toPart);
            return (fromP?.type === 'ldr' && toP?.type === 'esp32') || (fromP?.type === 'esp32' && toP?.type === 'ldr');
          });

          // Check if DMM is wired to ESP32
          const isDmmWiredToEsp32_3V3 = wires.some(w => {
            const fromP = schematicParts.find(p => p.id === w.fromPart);
            const toP = schematicParts.find(p => p.id === w.toPart);
            return (fromP?.type === 'esp32' && w.fromPin === '3V3' && toP?.type === 'dmm') ||
                   (toP?.type === 'esp32' && w.toPin === '3V3' && fromP?.type === 'dmm');
          });
          const isDmmWiredToEsp32_D2 = wires.some(w => {
            const fromP = schematicParts.find(p => p.id === w.fromPart);
            const toP = schematicParts.find(p => p.id === w.toPart);
            return (fromP?.type === 'esp32' && (w.fromPin === 'D2' || w.fromPin === 'D4') && toP?.type === 'dmm') ||
                   (toP?.type === 'esp32' && (w.toPin === 'D2' || w.toPin === 'D4') && fromP?.type === 'dmm');
          });

          // Determine measured system voltage
          let rawV;
          if (isDmmWiredToEsp32_3V3) {
            rawV = 3.30;
          } else if (isDmmWiredToEsp32_D2) {
            rawV = isEspD2High ? 3.30 : 0.00;
          } else if (isDmmWiredToSolar || isScopeWiredToSolar || isArduinoWiredToSolar || isSolarWiredToEsp32 || (hasSolar && !hasLdr)) {
            rawV = solarVoc;
          } else if (hasSolar && hasLdr) {
            rawV = isDmmWiredToSolar ? solarVoc : ldrV;
          } else {
            rawV = ldrV;
          }

          const jitter = rawV > 0.05 ? (Math.random() - 0.5) * 0.02 : 0;
          const calcV = Math.max(0.00, Math.min(5.00, parseFloat((rawV + jitter).toFixed(2))));
          
          setVoltage(calcV);

          // Current calculation: for solar it scales with irradiance and load (0 - 50mA)
          const calcCurrent = isDmmWiredToEsp32_3V3 ? 18.5 :
            ((rawV === solarVoc)
              ? parseFloat(((calcV / 100) * 1000).toFixed(1))
              : parseFloat(((calcV / 82) * 1000).toFixed(1)));
          setCurrentVal(calcCurrent);

          // 4. Arduino Uno Logic Execution:
          const adcVal = Math.floor((calcV / 5.0) * 1023);
          const d13State = adcVal >= 420; // Active threshold
          setIsD13High(d13State);

          // 5. ESP32 Logic Execution (12-bit ADC: 0 to 4095 referenced to 3.3V)
          if (hasEsp32) {
            const espSensorV = (isSolarWiredToEsp32 || isLdrWiredToEsp32) ? calcV : (hasSolar ? solarVoc : ldrV);
            const espAdcVal = Math.min(4095, Math.max(0, Math.floor((espSensorV / 3.3) * 4095)));
            const espD2State = espAdcVal >= 1350; // Threshold ~1.1V
            setEspAdc(espAdcVal);
            setIsEspD2High(espD2State);
          }

          // 6. Servo angle based on analog reading (0 to 180 degrees)
          setServoAngle(Math.min(180, Math.max(0, Math.round((calcV / 5.0) * 180))));

        }, 150);

        return () => clearInterval(interval);
      }, [isRunning, sunlight, clouds, temperature, schematicParts, wires, isEspD2High]);

      // Serial UART Telemetry Logger

        if (!isRunning) return;
        const serialInterval = setInterval(() => {
          const nowStr = new Date().toTimeString().split(' ')[0];
          const rawAdc = Math.floor((voltage / 5.0) * 1023);
          const espPart = schematicParts.find(p => p.type === 'esp32');
          const espStr = espPart ? ` | ESP32_ADC: ${espAdc} (12b) | IO2: ${isEspD2High ? 'HIGH' : 'LOW'}` : '';
          const logEntry = `[${nowStr}] ADC_A0: ${rawAdc} | V: ${voltage.toFixed(2)}V | D13: ${isD13High ? 'HIGH' : 'LOW'}${espStr} | Sun: ${sunlight}W/m²`;
          setSerialLogs(prev => [logEntry, ...prev.slice(0, 19)]);
        }, 1200);

        return () => clearInterval(serialInterval);
      }, [isRunning, voltage, isD13High, sunlight, espAdc, isEspD2High, schematicParts]);

          {/* ======================================================== */}
          {/* MODAL: CLOUD DATABASE SAVE PROJECT                       */}
          {/* ======================================================== */}
          <SaveProjectModal
            isOpen={saveModalOpen}

              sunlight,
              temperature,
              clouds,
              timeMinutes,
              weather: activeWeather,
              location: currentLocation

              setCurrentSavedProject(saved);

            isOpen={openProjectModalOpen}

          {/* MODAL: ROLE-BASED PROJECT SHARING & COLLABORATION        */}
          {/* ======================================================== */}
          <ShareProjectModal
            isOpen={shareModalOpen}
            onClose={() => setShareModalOpen(false)}
            project={currentSavedProject || {
              id: 'unsaved',
              title: 'Active Workbench Circuit',

            }}
            currentUser={currentUser}
          />

        </div>
      );
    }

    // =========================================================================
    // VIEW MODE 1: 2D CIRCUIT LAYER (SCHEMATIC CANVAS ENGINE)
    // =========================================================================
    function SchematicCanvasView({
      schematicParts,
      setSchematicParts,
      wires,
      setWires,
      selectedPartId,
      setSelectedPartId,
      selectedWireId,
      setSelectedWireId,
      activeLibraryCategory,
      setActiveLibraryCategory,
      searchQuery,
      setSearchQuery,
      onExecuteIn3D,
      voltage,
      currentVal,
      sunlight,
      temperature,
      clouds,
      isD13High,
      servoAngle,
      potValue,
      setPotValue,
      onResetSample,
      onLoadSolarSample,
      onLoadEspSample,
      isEspD2High,
      espAdc,
      onSaveProject,
      onOpenProject
    }) {
      const canvasContainerRef = useRef(null);
      const [wiringStartPin, setWiringStartPin] = useState(null); // { partId, pinId, x, y }
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
      const [dragState, setDragState] = useState(null);
      const [canvasOffset, setCanvasOffset] = useState({ x: 0, y: 0 });

      const [panStart, setPanStart] = useState({ x: 0, y: 0 });

        'Microcontrollers',
        'Power',
        'Sensors',
        'Passives & Discrete',
        'Semiconductors & Actuators',
        'Instruments'

      // Add component from library drawer
      const handleAddComponent = (template, customPos = null) => {

        } else if (template.id === 'potentiometer') {
          newPins = [

        } else if (template.id === 'led' || template.id === 'led_green') {
          extraProps.color = template.id === 'led_green' ? 'green' : 'red';
          newPins = [
            { id: 'anode', name: 'A (+)', label: '+', side: 'left', relX: 0, relY: 45 },
            { id: 'cathode', name: 'K (-)', label: '-', side: 'right', relX: 80, relY: 45 }
          ];
        } else if (template.id === 'buzzer') {
          newPins = [
            { id: 'pos', name: '+', label: '+', side: 'left', relX: 0, relY: 40 },
            { id: 'neg', name: '-', label: '-', side: 'right', relX: 80, relY: 40 }
          ];
        } else if (template.id === 'servo') {

            { id: 'sig', name: 'SIG', label: 'SIG', side: 'left', relX: 0, relY: 30 },

            { id: 'gnd', name: 'GND', label: 'GND', side: 'left', relX: 0, relY: 80 }
          ];
        } else if (template.id === 'lcd16x2') {
          newPins = [
            { id: 'gnd', name: 'GND', label: 'GND', side: 'bottom', relX: 40, relY: 100 },
            { id: 'vcc', name: 'VCC', label: 'VCC', side: 'bottom', relX: 70, relY: 100 },
            { id: 'sda', name: 'SDA', label: 'SDA', side: 'bottom', relX: 100, relY: 100 },
            { id: 'scl', name: 'SCL', label: 'SCL', side: 'bottom', relX: 130, relY: 100 }
          ];
        } else if (template.id === 'dmm') {
          newPins = [
            { id: 'dmm_v', name: 'V_IN', label: 'VΩ', side: 'left', relX: 0, relY: 45 },
            { id: 'dmm_com', name: 'COM', label: 'COM', side: 'left', relX: 0, relY: 85 }
          ];
        } else if (template.id === 'scope') {
          newPins = [
            { id: 'ch1', name: 'CH1', label: 'CH1', side: 'left', relX: 0, relY: 40 },
            { id: 'ch2', name: 'CH2', label: 'CH2', side: 'left', relX: 0, relY: 70 },
            { id: 'gnd', name: 'GND', label: 'GND', side: 'right', relX: 160, relY: 55 }
          ];
        } else if (template.id === 'gnd') {
          newPins = [
            { id: 'gnd_pin', name: 'GND', label: 'GND', side: 'top', relX: 40, relY: 0 }
          ];
        } else {
          newPins = [
            { id: 'p1', name: '1', label: '1', side: 'top', relX: 40, relY: 0 },
            { id: 'p2', name: '2', label: '2', side: 'bottom', relX: 40, relY: 80 }
          ];
        }

        const newPart = {
          id: newId,
          type: template.id,
          name: template.name,
          tag: template.tag,
          x: customPos ? customPos.x : (250 + Math.random() * 100),
          y: customPos ? customPos.y : (160 + Math.random() * 100),
          rotation: 0,
          pins: newPins,
          ...extraProps
        };

        setSchematicParts(prev => [...prev, newPart]);
        setSelectedPartId(newId);
      };

      // Keyboard delete wire or part
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Delete' || e.key === 'Backspace') {
            if (selectedWireId) {
              setWires(prev => prev.filter(w => w.id !== selectedWireId));
              setSelectedWireId(null);
            } else if (selectedPartId) {
              setSchematicParts(prev => prev.filter(p => p.id !== selectedPartId));
              setWires(prev => prev.filter(w => w.fromPart !== selectedPartId && w.toPart !== selectedPartId));
              setSelectedPartId(null);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedWireId, selectedPartId]);

      // Pin Clicking & Wiring
      const handlePinClick = (partId, pinId, pinAbsX, pinAbsY, e) => {
        e.stopPropagation();
        if (!wiringStartPin) {
          setWiringStartPin({ partId, pinId, x: pinAbsX, y: pinAbsY });
        } else {
          if (wiringStartPin.partId === partId && wiringStartPin.pinId === pinId) {
            setWiringStartPin(null);
            return;
          }
          const newWire = {
            id: `wire-${Date.now()}`,
            fromPart: wiringStartPin.partId,
            fromPin: wiringStartPin.pinId,
            toPart: partId,
            toPin: pinId
          };
          setWires(prev => [...prev, newWire]);
          setWiringStartPin(null);
        }
      };

      // Mouse movements
      const handleCanvasMouseMove = (e) => {
        const rect = canvasContainerRef.current.getBoundingClientRect();
        const curX = e.clientX - rect.left - canvasOffset.x;
        const curY = e.clientY - rect.top - canvasOffset.y;
        setMousePos({ x: curX, y: curY });

        if (dragState) {
          const dx = e.clientX - dragState.startMouseX;
          const dy = e.clientY - dragState.startMouseY;
          setSchematicParts(prev => prev.map(p => {
            if (p.id === dragState.partId) {
              return {
                ...p,
                x: Math.round((dragState.origPartX + dx) / 10) * 10,
                y: Math.round((dragState.origPartY + dy) / 10) * 10
              };
            }
            return p;
          }));
        } else if (isPanning) {
          setCanvasOffset({
            x: e.clientX - panStart.x,
            y: e.clientY - panStart.y
          });
        }
      };

      const handleCanvasMouseUp = () => {
        setDragState(null);
        setIsPanning(false);
      };

      const handleCanvasMouseDown = (e) => {
        if (e.target === canvasContainerRef.current || e.target.tagName === 'svg') {
          if (wiringStartPin) {
            setWiringStartPin(null);
          } else {
            setSelectedPartId(null);
            setSelectedWireId(null);
            setIsPanning(true);
            setPanStart({ x: e.clientX - canvasOffset.x, y: e.clientY - canvasOffset.y });
          }
        }
      };

      const getPinCoord = (partId, pinId) => {
        const part = schematicParts.find(p => p.id === partId);
        if (!part) return { x: 0, y: 0 };
        const pin = part.pins.find(pin => pin.id === pinId);
        if (!pin) return { x: part.x, y: part.y };
        return {
          x: part.x + pin.relX,
          y: part.y + pin.relY
        };
      };

      // Filtered component catalog
      const filteredCatalog = COMPONENT_LIBRARY.filter(item => {
        const matchesCategory = activeLibraryCategory === 'All' || 
                                item.category === activeLibraryCategory ||
                                (activeLibraryCategory === 'Power' && (item.category === 'Power' || item.tag === 'PWR')) ||
                                (activeLibraryCategory === 'Instruments' && (item.category === 'Instruments' || item.tag === 'IP'));
        const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              item.tag.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="w-full h-full flex flex-col bg-[#f8fafc] relative">
          
          {/* Sub-Header Toolbar (Top of 2D canvas) */}
          <div className="h-10 w-full bg-white/95 border-b border-slate-200 px-4 flex items-center justify-between z-20 text-xs font-mono shadow-sm">
            <div className="flex items-center space-x-3 text-slate-600">
              <span className="flex items-center space-x-1.5 text-blue-600 font-semibold">
                <span className="text-emerald-500 text-sm">■</span>
                <span>PROTEUS ISIS SCHEMATIC</span>
              </span>
              <span className="text-slate-300">|</span>
              <span className="text-slate-500">Netlist: <strong className="text-slate-800">{wires.length}</strong></span>
              <span className="text-slate-300">|</span>
              <span className="text-slate-500">Parts: <strong className="text-slate-800">{schematicParts.length}</strong></span>
              <span className="text-slate-300">|</span>
              <span className="text-amber-600 flex items-center space-x-1">
                <span>MCU D13:</span>
                <span className={`px-1.5 py-0.2 rounded font-bold ${isD13High ? 'bg-emerald-100 text-emerald-700 border border-emerald-300' : 'bg-slate-100 text-slate-600 border border-slate-200'}`}>
                  {isD13High ? 'HIGH (5V)' : 'LOW (0V)'}
                </span>
              </span>
              {schematicParts.some(p => p.type === 'esp32') && (
                <>
                  <span className="text-slate-300">|</span>
                  <span className="text-indigo-600 flex items-center space-x-1">
                    <span>ESP32 IO2:</span>
                    <span className={`px-1.5 py-0.2 rounded font-bold ${isEspD2High ? 'bg-indigo-100 text-indigo-700 border border-indigo-300' : 'bg-slate-100 text-slate-600 border border-slate-200'}`}>
                      {isEspD2High ? 'HIGH (3.3V)' : 'LOW (0V)'}
                    </span>
                    <span className="text-[10px] text-slate-400 font-mono">({espAdc})</span>
                  </span>
                </>
              )}
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => {
                  if (selectedPartId) {
                    setSchematicParts(prev => prev.map(p => p.id === selectedPartId ? { ...p, rotation: (p.rotation + 90) % 360 } : p));
                  }
                }}
                disabled={!selectedPartId}
                className={`px-2.5 py-1 rounded border flex items-center space-x-1 transition shadow-sm ${
                  selectedPartId ? 'bg-white hover:bg-slate-50 text-slate-700 border-slate-200' : 'bg-slate-50 text-slate-400 border-slate-200 cursor-not-allowed'

                <span>↺ Rotate</span>

                onClick={() => {
                  if (selectedWireId) {
                    setWires(prev => prev.filter(w => w.id !== selectedWireId));
                    setSelectedWireId(null);
                  } else if (selectedPartId) {
                    setSchematicParts(prev => prev.filter(p => p.id !== selectedPartId));
                    setWires(prev => prev.filter(w => w.fromPart !== selectedPartId && w.toPart !== selectedPartId));
                    setSelectedPartId(null);
                  }

                disabled={!selectedPartId && !selectedWireId}
                className={`px-2.5 py-1 rounded border flex items-center space-x-1 transition shadow-sm ${
                  (selectedPartId || selectedWireId) ? 'bg-white text-rose-600 hover:bg-rose-50 border-rose-200' : 'bg-slate-50 text-slate-400 border-slate-200 cursor-not-allowed'

              >
                <IconTrash2 className="w-3.5 h-3.5" />
                <span>🗑 Delete</span>
              </button>

              <button
                onClick={() => {
                  setSchematicParts([]);
                  setWires([]);
                  setSelectedPartId(null);
                  setSelectedWireId(null);

                Clear

              <button
                onClick={onResetSample}
                className="px-2.5 py-1 rounded bg-white hover:bg-slate-50 text-blue-600 border border-blue-200 shadow-sm transition"
                title="Load Arduino Uno + LDR Sensor Circuit"
              >
                Sample (Arduino + LDR)

              <button

                className="px-2.5 py-1 rounded bg-white hover:bg-slate-50 text-amber-600 border border-amber-200 shadow-sm transition flex items-center space-x-1"

              >
                <IconSun className="w-3.5 h-3.5 text-amber-500" />
                <span>Sample (Solar PV)</span>
              </button>

              <button
                onClick={onLoadEspSample}

              >
                <IconCpu className="w-3.5 h-3.5 text-indigo-500" />
                <span>Sample (ESP32 IoT)</span>
              </button>

              <div className="h-4 w-px bg-slate-300 mx-0.5"></div>

              {/* 💾 Save Project button */}
              <button
                onClick={onSaveProject}
                className="px-2.5 py-1 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 shadow-sm transition flex items-center space-x-1 font-semibold text-xs"
                title="Save circuit schematic to PostgreSQL Cloud"
              >
                <span>💾 Save Project</span>
              </button>

              {/* 📂 Open Project button */}

                onClick={onOpenProject}
                className="px-2.5 py-1 rounded bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 shadow-sm transition flex items-center space-x-1 font-semibold text-xs"
                title="Open saved circuit from PostgreSQL Cloud"
              >
                <span>📂 Open Project</span>
              </button>

              <button
                onClick={onExecuteIn3D}
                className="px-4 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold flex items-center space-x-1.5 shadow-md shadow-emerald-600/20 transition transform active:scale-95"
              >
                <IconPlay className="w-3.5 h-3.5 text-white" />
                <span>▶ EXECUTE IN 3D</span>
              </button>
            </div>
          </div>

          {/* Central Body: Expanded Device Libraries Drawer + 2D Canvas */}
          <div className="flex-1 flex overflow-hidden relative">
            
            {/* Expanded Searchable DEVICE LIBRARIES Drawer */}
            <div className="w-80 bg-white/95 border-r border-slate-200 flex flex-col z-20 shadow-lg pl-16 pr-3 py-3">
              
              <div className="flex items-center justify-between pb-2 border-b border-slate-200 mb-2">
                <div className="font-semibold text-xs tracking-wider uppercase text-slate-800 font-mono flex items-center space-x-1.5">
                  <IconCpu className="w-4 h-4 text-blue-600" />
                  <span>DEVICE LIBRARIES</span>
                </div>
                <span className="text-[10px] font-mono text-slate-500">{filteredCatalog.length} Parts</span>
              </div>

              {/* Search Bar Input */}
              <div className="relative mb-2.5">
                <input
                  type="text"
                  placeholder="Search parts, tags, ICs..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 font-mono"
                />
                <IconSearch className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
              </div>

              {/* Filter Category Tags */}
              <div className="flex flex-wrap gap-1 mb-2.5">
                {CATEGORIES.map(cat => {
                  const isActive = activeLibraryCategory === cat;
                  return (
                    <button
                      key={cat}
                      onClick={() => setActiveLibraryCategory(cat)}
                      className={`text-[10px] font-mono px-2 py-0.5 rounded transition ${
                        isActive

                try {
                  const template = JSON.parse(rawData);
                  if (!template || !template.id) return;
                  const rect = canvasContainerRef.current.getBoundingClientRect();
                  const dropX = e.clientX - rect.left - canvasOffset.x - 80;
                  const dropY = e.clientY - rect.top - canvasOffset.y - 40;
                  handleAddComponent(template, { x: Math.max(20, dropX), y: Math.max(20, dropY) });

                  console.error('Drop error:', err);
                }

              className="flex-1 h-full schematic-dot-grid relative cursor-crosshair overflow-hidden"

                className="w-full h-full relative"

                    const isSelected = selectedWireId === wire.id;
                    const midX = start.x + (end.x - start.x) * 0.5;
                    const pathD = `M ${start.x} ${start.y} L ${midX} ${start.y} L ${midX} ${end.y} L ${end.x} ${end.y}`;

                    return (
                      <g 
                        key={wire.id}
                        className="pointer-events-auto cursor-pointer group"
                        onClick={(e) => {
                          e.stopPropagation();
                          setSelectedWireId(wire.id);
                          setSelectedPartId(null);

                        {/* Invisible thick hover target */}

                        {/* Glow halo */}
                        <path
                          d={pathD}
                          fill="none"
                          stroke={isSelected ? '#38bdf8' : '#10b981'}
                          strokeWidth={isSelected ? '6' : '4'}
                          strokeOpacity={isSelected ? '0.6' : '0.2'}
                          strokeLinecap="round"
                        />
                        {/* Wire core line */}
                        <path
                          d={pathD}
                          fill="none"
                          stroke={isSelected ? '#2563eb' : '#059669'}
                          strokeWidth="2.5"
                          strokeLinecap="round"

                        <circle cx={start.x} cy={start.y} r="3" fill={isSelected ? '#2563eb' : '#059669'} />
                        <circle cx={end.x} cy={end.y} r="3" fill={isSelected ? '#2563eb' : '#059669'} />

                      stroke="#2563eb"
                      strokeWidth="2.5"
                      strokeDasharray="4,4"

    // =========================================================================
    // OSCILLOSCOPE CANVAS COMPONENT
    // =========================================================================
    function OscilloscopeCanvas({ voltage, currentVal, isRunning }) {
      const canvasRef = useRef(null);
      const historyRef = useRef({
        vPoints: new Array(180).fill(3.26),
        cPoints: new Array(180).fill(42.5),
        time: 0
      });

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const render = () => {
          if (isRunning) {
            historyRef.current.time += 0.05;
            historyRef.current.vPoints.shift();
            historyRef.current.cPoints.shift();

            const vNoise = (Math.sin(historyRef.current.time * 8) * 0.035) + (Math.random() - 0.5) * 0.02;
            const cNoise = (Math.cos(historyRef.current.time * 6) * 0.25) + (Math.random() - 0.5) * 0.15;

            historyRef.current.vPoints.push(voltage + vNoise);
            historyRef.current.cPoints.push(currentVal + cNoise);
          }

          const width = canvas.width;
          const height = canvas.height;

          ctx.fillStyle = '#080d14';
          ctx.fillRect(0, 0, width, height);

          ctx.strokeStyle = '#182433';
          ctx.lineWidth = 1;

          const vDivs = 8;
          for (let i = 0; i <= vDivs; i++) {
            const x = (width / vDivs) * i;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();

            if (i < vDivs) {
              for (let j = 1; j < 5; j++) {
                const subX = x + (width / vDivs) * (j / 5);
                ctx.fillStyle = '#1e3247';
                ctx.fillRect(subX - 0.5, height / 2 - 2, 1, 4);
              }
            }
          }

          const hDivs = 6;
          for (let i = 0; i <= hDivs; i++) {
            const y = (height / hDivs) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }

          ctx.strokeStyle = '#273c52';
          ctx.beginPath();
          ctx.moveTo(0, height / 2);
          ctx.lineTo(width, height / 2);
          ctx.moveTo(width / 2, 0);
          ctx.lineTo(width / 2, height);
          ctx.stroke();

          const ptsCount = historyRef.current.vPoints.length;

          // Channel 2 (Current - Cyan)
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.75;
          ctx.shadowColor = 'rgba(56, 189, 248, 0.75)';
          ctx.shadowBlur = 6;
          ctx.beginPath();
          for (let i = 0; i < ptsCount; i++) {
            const x = (i / (ptsCount - 1)) * width;
            const c = historyRef.current.cPoints[i];
            const y = height - (c / 100) * (height * 0.75) - 15;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Channel 1 (Voltage - Amber)
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 2.0;
          ctx.shadowColor = 'rgba(245, 158, 11, 0.85)';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          for (let i = 0; i < ptsCount; i++) {
            const x = (i / (ptsCount - 1)) * width;
            const v = historyRef.current.vPoints[i];
            const y = height - (v / 5.2) * (height * 0.85) - 10;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          ctx.shadowBlur = 0;

          animId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animId);
      }, [isRunning, voltage, currentVal]);

      return (
        <canvas 
          ref={canvasRef} 
          width={300} 
          height={150} 
          className="w-full h-36 block rounded cursor-crosshair"
        />
      );
    }

          );
          frameBorder.castShadow = true;

          frameGroup.add(frameBorder);

          // C. Procedural Photovoltaic Silicon Wafers with Metallic Grid Lines & Busbars
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 384;
          const ctx = canvas.getContext('2d');

          ctx.fillRect(0, 0, 512, 384);

          // Draw 4x3 silicon cells
          const cols = 4;
          const rows = 3;
          const pad = 8;
          const cellW = (512 - pad * (cols + 1)) / cols;
          const cellH = (384 - pad * (rows + 1)) / rows;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const cx = pad + c * (cellW + pad);
              const cy = pad + r * (cellH + pad);

              const cellGrad = ctx.createLinearGradient(cx, cy, cx + cellW, cy + cellH);
              cellGrad.addColorStop(0, '#0c274c');
              cellGrad.addColorStop(1, '#06162a');
              ctx.fillStyle = cellGrad;
              ctx.fillRect(cx, cy, cellW, cellH);

              // Fine metallic silver grid lines (fingers)
              ctx.strokeStyle = 'rgba(203, 213, 225, 0.28)';
              ctx.lineWidth = 1;
              for (let gy = cy + 6; gy < cy + cellH; gy += 6) {
                ctx.beginPath();
                ctx.moveTo(cx, gy);
                ctx.lineTo(cx + cellW, gy);

            floorRef.current.material.metalness = 0.25;

          if (tableTopRef.current) {
            tableTopRef.current.material.roughness = 0.04;
          }
          if (esdMatRef.current) {
            esdMatRef.current.material.roughness = 0.12;
          }
        } else {
          // Clouds <= 80 (Standard daylight / evening / night lighting)
          const hour = timeMinutes / 60;
          const isDay = hour >= 6 && hour <= 19;
          let sunColorHex = isDay ? (Math.abs(hour - 12) > 4.5 ? 0xf97316 : 0xfef08a) : 0x38bdf8;
          let beamOpacity = (sunlight / 1000) * 0.38 * (1 - clouds * 0.008);

          sceneRef.current.background.setHex(0xf1f5f9);
          if (sceneRef.current.fog) {
            sceneRef.current.fog.color.setHex(0xf1f5f9);
            sceneRef.current.fog.density = 0.025;

            ambientLightRef.current.color.setHex(0xdbeafe);
            ambientLightRef.current.intensity = 1.3;
          } else {
            ambientLightRef.current.color.setHex(0xffffff);
            ambientLightRef.current.intensity = 1.25;
          }

          sunLightRef.current.intensity = isDay ? Math.max(0.2, (sunlight / 1000) * 2.2 * (1 - clouds * 0.008)) : 0.15;
          sunLightRef.current.color.setHex(0xfffbeb);

          if (sunBeamRef.current) {
            sunBeamRef.current.material.color.setHex(sunColorHex);
            sunBeamRef.current.material.opacity = Math.max(0.02, beamOpacity);
          }
          if (sunFloorPatchRef.current) {
            sunFloorPatchRef.current.material.color.setHex(sunColorHex);
            sunFloorPatchRef.current.material.opacity = Math.max(0.03, beamOpacity * 0.9);

          if (dustParticlesRef.current) {
            dustParticlesRef.current.visible = true;
          }

          // Deactivate rain & splash particles
          if (rainMeshRef.current) rainMeshRef.current.visible = false;
          if (splashMeshRef.current) splashMeshRef.current.visible = false;

          // Restore dry matte materials
          if (floorRef.current) {
            floorRef.current.material.roughness = 0.5;
            floorRef.current.material.metalness = 0.1;
          }
          if (tableTopRef.current) {
            tableTopRef.current.material.roughness = 0.2;
          }
          if (esdMatRef.current) {
            esdMatRef.current.material.roughness = 0.45;
          }
        }

        // Update 3D Solar Panel active reflection sheen and energy capture glow
        if (solarMaterialRef.current) {
          const sRatio = (sunlight / 1000) * (1 - (clouds || 0) * 0.0085);
          solarMaterialRef.current.emissiveIntensity = Math.max(0, sRatio * 0.45);
          solarMaterialRef.current.roughness = Math.max(0.08, 0.35 - sRatio * 0.25);
        }
      }, [sunlight, temperature, clouds, timeMinutes, currentLocation]);

      return (
        <div id="webgl-viewport" ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing"></div>
      );
    }

// Target: ATmega328P / Arduino Uno R3
// Node: Davanagere Lab • SBH06387

#include <Arduino.h>

const int ldrPin = A0;      // Analog input from LDR voltage divider
const int ledPin = 13;      // Onboard status LED & Digital Pin 13
const int threshold = 420;  // Threshold (~2.05 V) to trigger actuator

void setup() {
  Serial.begin(115200);
  pinMode(ledPin, OUTPUT);
  Serial.println(F("[BOOT] Arduino Uno R3 Initialized - Open-World Lab"));
}

void loop() {
  int sensorValue = analogRead(ldrPin);
  float voltage = (sensorValue / 1023.0f) * 5.0f;

  if (sensorValue >= threshold) {
    digitalWrite(ledPin, HIGH); // Turn ON LED / Actuator
  } else {
    digitalWrite(ledPin, LOW);  // Turn OFF LED
  }

  // Telemetry stream
  Serial.print(F("A0: "));
  Serial.print(sensorValue);
  Serial.print(F(" | V: "));
  Serial.print(voltage, 2);
  Serial.print(F("V | D13: "));
  Serial.println(digitalRead(ledPin) ? "HIGH" : "LOW");

  delay(200);
}`;
