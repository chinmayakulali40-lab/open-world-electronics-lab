services:
  - type: web
    name: open-world-electronics-lab
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: open-world-electronics-lab-db
          property: connectionString

databases:
  - name: open-world-electronics-lab-db
    plan: free
    databaseName: open_world_electronics_lab_db
    postgresMajorVersion: "16"
